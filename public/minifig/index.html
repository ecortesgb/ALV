<meta charset="utf-8">
<title>Taller de Minifiguras ALV</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Lilita+One&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: consola de juego en 3 columnas (catálogo | escenario 3D | piezas). En celular se apila. Tema oscuro fijo a propósito. */
:root{
  --bg:#0d1321; --panel:#151d30; --panel2:#1c2740; --line:#2a3754;
  --fg:#eef2fb; --muted:#93a1c0; --accent:#ffcf1f; --accent2:#e3342f; --ok:#3ecf8e;
  --display:"Lilita One","Arial Black",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;margin:0}
*{box-sizing:border-box}
button,select,input{font-family:inherit;font-size:13px;color:var(--fg)}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:270px minmax(0,1fr) 330px;grid-template-rows:auto minmax(0,1fr);height:100%;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
header{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-family:var(--display);font-size:22px;letter-spacing:.5px;display:flex;align-items:center;gap:10px}
.logo i{width:30px;height:22px;background:var(--accent);border-radius:4px;position:relative;display:inline-block;box-shadow:inset 0 -4px 0 #c99a00}
.logo i::before,.logo i::after{content:"";position:absolute;top:-6px;width:9px;height:6px;background:var(--accent);border-radius:2px 2px 0 0}
.logo i::before{left:4px}.logo i::after{right:4px}
.sp{flex:1}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:800}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:#1a1300;border-color:var(--accent);box-shadow:inset 0 -3px 0 #c99a00}
.btn.red{background:var(--accent2);border-color:var(--accent2);box-shadow:inset 0 -3px 0 #9c1d1a}
aside{background:var(--panel);overflow:auto;min-height:0}
.left{border-right:1px solid var(--line);display:flex;flex-direction:column}
.right{border-left:1px solid var(--line)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:12px 12px 8px}
.vistas{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:12px 12px 0;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px}
.vista{background:transparent;border:0;border-radius:9px;padding:8px;font-weight:800;color:var(--muted)}
.vista[aria-selected="true"]{background:var(--accent);color:#1a1300}
.pz-sec{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:12px 12px 0}
.pz-sec button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 4px;font-weight:800;font-size:12px;color:var(--fg)}
.pz-sec button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.pz-list{display:grid;gap:6px;padding:4px 12px 16px;overflow:auto;min-height:0}
.pz-item{display:flex;align-items:center;gap:10px;text-align:left;background:var(--panel2);border:2px solid transparent;border-radius:12px;padding:8px 10px}
.pz-item[aria-current="true"]{border-color:var(--accent)}
.pz-item b{display:block;font-size:13px;line-height:1.2}
.pz-item small{display:block;color:var(--muted);font-weight:700;font-size:11px;margin-top:2px}
.pz-sw{display:flex;flex:none}
.pz-sw i{width:18px;height:18px;border-radius:50%;border:2px solid var(--panel2);margin-left:-6px;box-shadow:0 0 0 1px #0004}
.pz-sw i:first-child{margin-left:0}
#panelPz{display:flex;flex-direction:column;min-height:0;flex:1}
#panelPz[hidden]{display:none}
.tab{background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-weight:800;font-size:12px;color:var(--muted)}
.tab[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cat{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:4px 12px 12px}
.card{background:var(--panel2);border:2px solid transparent;border-radius:12px;padding:6px 6px 8px;text-align:center;font-weight:800;font-size:12px;line-height:1.2}
.card[aria-current="true"]{border-color:var(--accent)}
.card .th{aspect-ratio:400/520;width:100%;border-radius:8px;background:radial-gradient(circle at 50% 35%,#2d3d63,#141c2e);display:block;object-fit:contain;margin-bottom:6px}
.card small{display:block;color:var(--muted);font-weight:700;font-size:11px;margin-top:2px}
.leftfoot{margin-top:auto;padding:12px;display:grid;gap:8px;border-top:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.stage{position:relative;min-height:0;background:radial-gradient(ellipse at 50% 40%,#33508f 0%,#1a2747 45%,#0b101c 100%);overflow:hidden}
.stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block;touch-action:none}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.45))}
.hud{position:absolute;z-index:2;display:flex;gap:6px;flex-wrap:wrap}
.hud.top{top:12px;left:12px;right:12px;justify-content:space-between;align-items:flex-start}
.hud.bot{bottom:12px;left:12px;right:12px;justify-content:center;flex-direction:column;align-items:center;gap:8px}
.big{display:inline-flex;align-items:center;gap:8px;background:#f7f8fc;color:#141b2e;border:0;border-radius:999px;padding:11px 22px;font-weight:800;font-size:15px;box-shadow:0 6px 18px #0006,inset 0 -3px 0 #c9cfdd}
.big.alt{background:var(--accent);color:#1a1300;box-shadow:0 6px 18px #0006,inset 0 -3px 0 #c99a00;min-width:130px;justify-content:center}
.big:active{transform:translateY(2px)}
.teclas{color:#c7d2ee;font-size:11px;font-weight:700;opacity:.75}
.ghost{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:clamp(70px,16vw,220px);color:#ffffff12;letter-spacing:4px;pointer-events:none;user-select:none;transition:opacity .3s;white-space:nowrap;overflow:hidden}
#flechas{position:absolute;inset:0;pointer-events:none;z-index:3}
.fila{position:absolute;left:0;display:flex;align-items:center;gap:6px;transform:translate(-50%,-50%);transition:opacity .25s}
.fila .ar{pointer-events:auto;width:38px;height:38px;border-radius:50%;border:0;background:#f7f8fcee;color:#141b2e;font-size:18px;font-weight:800;box-shadow:0 4px 12px #0007;display:grid;place-items:center}
.fila .ar:hover{background:var(--accent)}
.fila .hueco{flex:none}
.fila .lb{position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);white-space:nowrap;font-size:11px;font-weight:800;background:#0b1220cc;border-radius:999px;padding:3px 9px;color:#fff}
.fila.activa .ar{background:var(--accent);color:#1a1300}
.fila.oculta{opacity:0}.fila.oculta .ar{pointer-events:none}
.name{font-family:var(--display);font-size:30px;line-height:1;text-shadow:0 3px 0 #0008}
.name small{display:block;font-family:var(--body);font-size:12px;font-weight:800;color:var(--accent);letter-spacing:1.5px;text-transform:uppercase;margin-top:6px;text-shadow:none}
.chip{background:#0b1220cc;border:1px solid #ffffff22;border-radius:999px;padding:7px 12px;font-weight:800;font-size:12px;backdrop-filter:blur(6px)}
.chip[aria-pressed="true"]{background:var(--accent);color:#1a1300;border-color:var(--accent)}
.sec{border-bottom:1px solid var(--line);padding:12px 14px}
.sec h3{font-family:var(--display);font-weight:400;font-size:16px;margin:0 0 10px;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.sec h3 b{width:10px;height:10px;border-radius:3px;background:var(--accent);display:inline-block}
.f{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;gap:6px 10px;margin-bottom:8px}
.f label{color:var(--muted);font-weight:700;font-size:12px}
.f select,.f input[type=text],.f input[type=number]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 8px}
.cols{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
input[type=color]{width:34px;height:30px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:2px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700;color:var(--muted)}
.chips button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.hint{color:var(--muted);font-size:12px;line-height:1.45;margin:6px 0 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:800;z-index:9;max-width:90vw}
.busy{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:#0b101ccc;font-family:var(--display);font-size:22px}
@media (max-width:980px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 62vh auto auto;height:auto}
  .stage{grid-row:2}.left{grid-row:3;border-right:0}.right{grid-row:4;border-left:0}
  .cat{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
  aside{overflow:visible}
}
@media (max-width:600px){
  #poses{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;max-width:100%;padding-bottom:4px;scrollbar-width:none}
  #poses .chip{flex:none}
  .big{padding:9px 16px;font-size:14px}
  .teclas{display:none}
  .name{font-size:24px}
}

/* ---- Creador estilo cómic: libro rojo de dos páginas, paneles con borde negro y trama de puntos ---- */
.comic{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;gap:10px;background:radial-gradient(ellipse at 50% 30%,#3a2a20,#120c09 75%);color:#111;padding-block:14px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.comic[hidden]{display:none}
.comic button,.comic label,.comic .cartela,.comic .etq{color:#111}
.libro{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:6px;background:#8e0f15;border-radius:16px;padding:10px;box-shadow:0 18px 50px #000a,inset 0 0 0 3px #5c070b}
.pag{position:relative;min-height:0;background:#c4161c;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 0 0 3px #111}
.cartela{font-family:"Bangers","Lilita One",Impact,sans-serif;font-size:clamp(24px,3.2vw,40px);letter-spacing:1.5px;background:#fff;border:4px solid #111;padding:2px 16px;align-self:flex-start;transform:rotate(-1deg);box-shadow:4px 4px 0 #111;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cm-titulo{align-self:stretch;text-align:center;transform:none}
.visor{position:relative;flex:1;min-height:240px;border:4px solid #111;border-radius:4px;overflow:hidden;background:#d9a441}
.visor canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block;touch-action:none}
.visor::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#0000002a 1.1px,transparent 1.4px);background-size:7px 7px;mix-blend-mode:multiply}
.cm-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:44px;height:44px;border-radius:50%;border:3px solid #111;background:#fff;font:400 26px "Bangers",Impact,sans-serif;box-shadow:3px 3px 0 #111;cursor:pointer}
.cm-nav.izq{left:10px}.cm-nav.der{right:10px}
.cm-zoom{position:absolute;left:12px;right:12px;bottom:10px;z-index:2;display:flex;align-items:center;gap:8px;font:400 15px "Bangers",Impact,sans-serif;color:#fff;text-shadow:2px 2px 0 #111}
.cm-zoom input{flex:1;accent-color:#ffd21a}
#cmContenido{flex:1;min-height:0;overflow:auto;padding:2px 4px 6px 2px}
.cm-grid{display:grid;gap:10px}
.cm-6{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(120px,1fr)}
.cm-11{grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(110px,1fr)}
.cm-piezas{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));grid-auto-rows:max-content;align-content:start}
.panel{position:relative;border:4px solid #111;background:#fff;border-radius:3px;padding:0;overflow:hidden;cursor:pointer;box-shadow:4px 4px 0 #111;transition:transform .12s}
.panel img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:grayscale(1) contrast(1.25) brightness(1.05);background:#e9e9e9}
.panel::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background-image:radial-gradient(#0003 1.2px,transparent 1.5px);background-size:6px 6px}
.panel.sel,.panel:focus-visible{outline:5px solid #ffd21a;outline-offset:-1px;transform:rotate(-.6deg) scale(1.02)}
.panel.sel img,.panel:focus-visible img{filter:none;background:#f39a52}
.etq{position:absolute;z-index:2;left:8px;bottom:8px;background:#fff;border:3px solid #111;padding:1px 10px;font:400 clamp(15px,1.7vw,22px) "Bangers",Impact,sans-serif;letter-spacing:1px;box-shadow:2px 2px 0 #111}
.pieza{position:relative;height:118px;min-height:118px;border:4px solid #111;background:#fff;border-radius:3px;cursor:pointer;padding:0;overflow:hidden;box-shadow:3px 3px 0 #111}
.pieza img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.pieza::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#0002 1px,transparent 1.3px);background-size:6px 6px}
.pieza .nom{position:absolute;left:0;right:0;bottom:0;background:#111;color:#fff;font:700 10.5px/1.2 "Nunito",sans-serif;padding:3px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pieza.on{outline:5px solid #ffd21a;outline-offset:-1px}
.pieza .marca{position:absolute;top:-4px;left:-4px;width:34px;height:34px;background:linear-gradient(135deg,#3ecf3e 50%,transparent 50%)}
.pieza.lock{opacity:.45;filter:sepia(.6)}
.pieza.lock::after{content:"BLOQUEADO";position:absolute;inset:auto 0 40% 0;text-align:center;font:400 14px "Bangers",Impact,sans-serif;color:#fff;text-shadow:2px 2px 0 #111}
.poder{display:grid;place-items:center;background:radial-gradient(circle,var(--c) 0 35%,#fff 36%);}
.poder .boom{font:400 clamp(15px,1.6vw,20px)/1.05 "Bangers",Impact,sans-serif;letter-spacing:.5px;background:#fff;border:3px solid #111;padding:4px 8px;transform:rotate(-3deg);box-shadow:2px 2px 0 #111;text-align:center}
.poder:not(.on){filter:grayscale(.9)}
.cm-paleta{grid-column:1/-1;background:#fff;border:4px solid #111;padding:10px;box-shadow:3px 3px 0 #111;display:grid;gap:8px}
.cm-sw{display:flex;flex-wrap:wrap;gap:6px}
.cm-sw button,.cm-otro{width:28px;height:28px;border-radius:50%;border:3px solid #111;cursor:pointer;padding:0}
.cm-sw button[aria-pressed="true"]{outline:3px solid #ffd21a;outline-offset:1px}
.cm-otro{display:grid;place-items:center;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);font:900 16px sans-serif;color:#fff;text-shadow:0 0 2px #000;position:relative;overflow:hidden}
.cm-otro input{position:absolute;inset:0;opacity:0;cursor:pointer}
.cm-chips{display:flex;flex-wrap:wrap;gap:6px}
.cm-chips button{font:400 16px "Bangers",Impact,sans-serif;letter-spacing:.5px;background:#fff;border:3px solid #111;padding:3px 10px;box-shadow:2px 2px 0 #111;cursor:pointer}
.cm-chips button[aria-pressed="true"]{background:#ffd21a}
.cm-varios{display:grid;gap:10px;background:#fff;border:4px solid #111;padding:14px;box-shadow:4px 4px 0 #111;align-content:start}
.cm-varios label{display:grid;gap:4px;font:400 17px "Bangers",Impact,sans-serif;letter-spacing:.5px}
.cm-varios input[type=text],.cm-varios input[type=number],.cm-varios select{font:700 14px "Nunito",sans-serif;border:3px solid #111;padding:6px 8px;background:#fff;color:#111}
.cm-varios .cm-check{display:flex;align-items:center;gap:8px;font:700 13px "Nunito",sans-serif}
.cm-sub{font:400 17px "Bangers",Impact,sans-serif;letter-spacing:.5px;margin-top:4px}
.cm-estado{min-height:42px;background:#fff;border:4px solid #111;display:flex;align-items:center;justify-content:center;gap:10px;font:400 clamp(16px,2vw,24px) "Bangers",Impact,sans-serif;letter-spacing:1px;box-shadow:3px 3px 0 #111;padding:2px 10px;text-align:center}
.cm-deshacer{font:700 13px "Nunito",sans-serif;border:2px solid #111;background:#ffd21a;padding:3px 10px;cursor:pointer}
.cm-barra{display:flex;justify-content:flex-end;align-items:center;gap:14px;flex-wrap:wrap;color:#f3e7d6;font:400 18px "Bangers",Impact,sans-serif;letter-spacing:1px}
.cm-barra button{font:inherit;letter-spacing:inherit;background:transparent;border:0;color:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.cm-barra kbd{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:50%;background:#f3e7d6;color:#111;font:700 12px "Nunito",sans-serif;padding:0 5px}
/* ---- Personalizador: cápsulas (tubos de vidrio con la figura flotando) ---- */
.comic .cartela,.comic .cm-estado{flex:none}
.cm-barra button[hidden]{display:none}
.pr-col{display:flex;flex-direction:column;gap:12px}
.pr-tabs{position:sticky;top:0;z-index:3;background:#c4161c;padding-bottom:6px}
.pr-nota{margin:0;font:700 13px/1.4 "Nunito",sans-serif;color:#333}
.pr-ok{background:#ffd21a!important}
.pr-peligro{background:#ff6b5a!important}
.pr-pronto{position:absolute;z-index:2;top:8px;right:8px;background:#111;color:#ffd21a;font:400 14px "Bangers",Impact,sans-serif;letter-spacing:1px;padding:2px 8px;transform:rotate(3deg)}
.cm-chips button:disabled{opacity:.55;cursor:default}
.caps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.cap{position:relative;aspect-ratio:3/5;padding:0;cursor:pointer;overflow:hidden;border:4px solid #111;border-radius:70px 70px 12px 12px;box-shadow:4px 4px 0 #111;
  background:linear-gradient(90deg,#7fd0ff55,#e9f8ff 28%,#9fe8ff66 55%,#ffffffaa 72%,#7fd0ff55),#bfe6ff}
.cap::before{content:"";position:absolute;inset:0 0 0 14%;width:12%;background:linear-gradient(#fff9,#fff3);border-radius:40px;z-index:2;pointer-events:none}
.cap::after{content:"";position:absolute;left:0;right:0;bottom:0;height:13%;background:repeating-linear-gradient(90deg,#222 0 10px,#333 10px 20px);border-top:4px solid #111;z-index:1}
.cap img{position:absolute;left:6%;width:88%;bottom:12%;height:78%;object-fit:contain;animation:flotar 3.2s ease-in-out infinite;z-index:1}
.cap.vacia img{filter:brightness(0);opacity:.22;animation:none}
.cap.vacia{background:linear-gradient(90deg,#7fd0ff33,#d8eefa 30%,#9fe8ff33 60%,#ffffff66),#a8c8dc}
.cap .etq{z-index:3;bottom:16%;left:50%;transform:translateX(-50%);white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis;font-size:clamp(13px,1.4vw,18px)}
.cap.sel{outline:5px solid #ffd21a;outline-offset:-1px}
.cap-act{position:absolute;z-index:3;top:12%;left:50%;transform:translateX(-50%) rotate(-4deg);background:#3ecf3e;border:3px solid #111;font:400 14px "Bangers",Impact,sans-serif;letter-spacing:1px;padding:1px 8px;white-space:nowrap}
.cap:nth-child(2) img{animation-delay:-1.1s}.cap:nth-child(3) img{animation-delay:-2.2s}
@keyframes flotar{0%,100%{transform:translateY(0)}50%{transform:translateY(-5%)}}
.pr-vacia{position:absolute;inset:0;z-index:1;display:grid;place-items:center;text-align:center;font:400 clamp(26px,4vw,48px)/1.1 "Bangers",Impact,sans-serif;letter-spacing:2px;color:#fff;text-shadow:3px 3px 0 #111;pointer-events:none}
.pr-vacia[hidden]{display:none}
/* ---- Editor básico: modo, barra de progreso, pie con Siguiente ---- */
#prContenido{flex:1;min-height:0;overflow:auto;padding:2px 4px 6px 2px}
.pr-barra{flex:none;display:grid;gap:8px}
.pr-barra[hidden],.pr-pie[hidden]{display:none}
.pr-modo{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pr-switch{display:inline-flex;border:3px solid #111;background:#fff;box-shadow:2px 2px 0 #111}
.pr-switch button{font:400 17px "Bangers",Impact,sans-serif;letter-spacing:.5px;padding:3px 12px;border:0;background:#fff;cursor:pointer}
.pr-switch button[aria-pressed="true"]{background:#ffd21a}
.pr-mini{font:400 16px "Bangers",Impact,sans-serif;letter-spacing:.5px;border:3px solid #111;background:#fff;box-shadow:2px 2px 0 #111;padding:3px 10px;cursor:pointer}
.pr-mini:disabled{opacity:.5;cursor:default}
.pr-moms{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pr-moms button{display:grid;gap:2px;text-align:left;border:3px solid #111;background:#fff;box-shadow:3px 3px 0 #111;padding:6px 8px;cursor:pointer;color:#111}
.pr-moms b{font:400 17px "Bangers",Impact,sans-serif;letter-spacing:.5px}
.pr-moms small{font:700 11.5px/1.2 "Nunito",sans-serif;color:#444}
.pr-moms button[aria-pressed="true"],[data-mom4][aria-pressed="true"]{background:#ffd21a}
@media (max-width:600px){.pr-moms{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pr-tabs-av{gap:5px}
.pr-tabs-av button{font-size:15px;padding:2px 8px}
.pr-texto{font:400 22px "Bangers",Impact,sans-serif;letter-spacing:1px;border:3px solid #111;padding:4px 10px;width:8em;background:#fff;color:#111;box-shadow:2px 2px 0 #111}
.pr-traje{background:#7fd0ff}
.pr-traje[aria-pressed="true"]{background:#ffd21a}
.pr-ocultos{font:700 12.5px/1.3 "Nunito",sans-serif;color:#111;background:#fff;border:3px dashed #111;padding:4px 8px}
.pr-prog{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}
.pr-prog button{height:28px;border:3px solid #111;background:#fff;font:400 15px "Bangers",Impact,sans-serif;padding:0;cursor:pointer}
.pr-prog button.hecho{background:#9be89b}
.pr-prog button[aria-current="step"]{background:#ffd21a;transform:translateY(-2px);box-shadow:2px 2px 0 #111}
.pr-pie{flex:none;display:flex;gap:8px}
.pr-pie button{font:400 22px "Bangers",Impact,sans-serif;letter-spacing:1px;border:4px solid #111;background:#fff;box-shadow:3px 3px 0 #111;padding:4px 16px;cursor:pointer}
.pr-pie button:disabled{opacity:.45;cursor:default}
.pr-pie .pr-sig{background:#ffd21a;flex:1}
.pr-bloque{display:grid;gap:6px}
.pr-bloque>.cm-sub{color:#fff;text-shadow:2px 2px 0 #111}
.pr-aviso{background:#fff7c2;border:3px solid #111;padding:6px 10px}
.pr-bloque .cm-sw{background:#fff;border:3px solid #111;padding:8px;box-shadow:3px 3px 0 #111}
.pr-pregunta{border-color:#111;background:#ffe9a8}
.pr-completo{position:absolute;z-index:3;top:10px;right:10px;font:400 16px "Bangers",Impact,sans-serif;letter-spacing:.5px;border:3px solid #111;background:#fff;box-shadow:2px 2px 0 #111;padding:3px 10px;cursor:pointer}
.pr-completo[hidden]{display:none}
@media (max-width:860px){.comic .libro{grid-template-columns:minmax(0,1fr)}#prContenido{overflow:visible;flex:none}.comic .pag{min-height:auto}.caps{gap:8px}.cap{border-radius:50px 50px 10px 10px}}
@media (max-width:860px){.libro{grid-template-columns:1fr;overflow:auto}.visor{min-height:46vh}.cm-11{grid-template-columns:repeat(2,minmax(0,1fr))}#cmContenido{overflow:visible}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.cap img{animation:none!important}}
/* ---- Pulido: foco visible con teclado y ajustes de la barra ---- */
.comic .pieza:focus-visible,.comic .cap:focus-visible,.comic .cm-chips button:focus-visible,.comic .pr-moms button:focus-visible,.comic .pr-prog button:focus-visible,.comic .cm-sw button:focus-visible{outline:4px solid #ffd21a;outline-offset:2px;box-shadow:0 0 0 7px #111}
.pr-ajustes{display:inline-flex;gap:12px;margin-right:auto}
.pr-ajustes button[aria-pressed="false"]{opacity:.7}
</style>

    </div>
    </div>
    <div id="panelPz" hidden>

    </div>
  </aside>

  <main class="stage" id="stage">
    <div class="hud top">
      <div class="name" id="nm"></div>
      <div class="cols">
        <button class="chip" data-cam="frente">Frente</button>

      </div>
    </div>
    <div class="ghost" id="ghost" aria-hidden="true">ARMADO</div>
    <div id="flechas"></div>
    <div class="hud bot">
      <div class="cols" style="justify-content:center">
        <button class="big" id="bMezclar"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Mezclar</button>
        <button class="big alt" id="bSeparar">Separar</button>
      </div>
      <div class="cols" id="poses" style="justify-content:center"></div>
      <div class="teclas">← → cambiar pieza · ↑ ↓ elegir pieza · Espacio separa o une</div>
    </div>
  </main>

  <aside class="right" id="editor"></aside>
</div>
