<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paracaídas · TV</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<link rel="stylesheet" href="tv.css">
<style>
.altura-individual{font:400 18px/1.2 "Lilita One",sans-serif;color:var(--amarillo);text-shadow:0 2px 2px var(--noche)}
.etiqueta{width:min(180px,14vw);white-space:normal;text-align:center}
.etiqueta .placa{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
/* O4: todos los avisos, altímetro, resultados y botones viven dentro de la franja. */
.franja-tv{position:fixed;top:max(140px,13vh);left:20px;right:20px;height:calc(var(--franja-tv) - max(140px,13vh) - 12px);display:flex;flex-direction:column;align-items:center;gap:8px}
.franja-tv .marcador{position:static;flex:none;font-size:22px;padding:4px 16px}
.franja-tv .centro{position:static;transform:none;flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none;font-size:clamp(30px,6vh,60px);line-height:1;white-space:normal;overflow-wrap:anywhere;-webkit-text-stroke:2px var(--borde)}
.franja-tv .podio{position:static;transform:none;flex:none;width:100%;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;padding:6px}
.franja-tv .podio div{font-size:16px;line-height:1.1;padding:4px 6px;text-align:center;overflow-wrap:anywhere}
.franja-tv .boton-tv{position:static;transform:none;flex:none;font-size:24px;padding:8px 24px}
</style>
</head>
<body>
<canvas id="lienzo" aria-hidden="true"></canvas>
<div class="capa" id="capa"></div>
<div class="titulo">Paracaídas</div>
<div class="sub" id="sub">Entra desde tu celular</div>
<div class="sala" id="sala"><small>Sala</small><b id="codigo">----</b><small id="como">Abre el control en otra pestaña</small>
  <a id="abrir" target="_blank" rel="noopener">+ Celular de prueba</a></div>
<div class="franja-tv">
  <div class="marcador oculto" id="marcador">Ronda <span id="ronda">1</span> / 3 · <span id="altimetro">— m</span></div>
  <div class="centro oculto" id="centro" role="status"></div>
  <div class="podio oculto" id="podio"></div>
  <button class="boton-tv" id="empezar" disabled>¡Empezar!</button>
</div>
<div class="aviso-red" id="red"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script src="../logicas.js"></script>
<script src="../motor-personajes.js"></script>
<script src="figuras-mj.js"></script>
<script src="escena-mj.js"></script>
<script type="module" src="tv-paracaidas.js"></script>
</body>
</html>
