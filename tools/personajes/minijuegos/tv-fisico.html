<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Físico · TV</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<link rel="stylesheet" href="tv.css">
<style>
html,body{background:#141a3a center/cover no-repeat}
body.esc-ciudad{background-image:url(/arte/ciudad-noche-1920.webp)}
body.esc-alberca{background-image:url(/arte/escenario-alberca-1920.webp)}
body.esc-fogata{background-image:url(/arte/escenario-patio-fogata-1920.webp)}
body.esc-parque{background-image:url(/arte/escenario-cancha-1920.webp)}
.velo{position:fixed;inset:0;background:linear-gradient(180deg,rgba(10,16,48,.55),rgba(10,16,48,.1) 45%,rgba(10,16,48,.35));pointer-events:none}
canvas{background:transparent}
.juego{position:fixed;left:50%;top:13%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
.cat{font:400 clamp(18px,2.2vw,30px)/1 "Lilita One",sans-serif;background:var(--morado);border:3px solid var(--borde);border-radius:999px;padding:8px 18px 10px;box-shadow:0 4px 0 var(--borde)}
.palabra{font:400 clamp(54px,8.5vw,128px)/1 "Lilita One",sans-serif;color:var(--amarillo);-webkit-text-stroke:4px var(--borde);text-shadow:0 8px 0 var(--borde);white-space:nowrap}
.tapada{display:flex;align-items:center;justify-content:center;min-width:min(46vw,560px);height:clamp(70px,10vw,130px);border-radius:22px;border:4px solid var(--borde);
  background:repeating-linear-gradient(135deg,#5a3fa8 0 18px,#4a3290 18px 36px);box-shadow:0 7px 0 var(--borde);font:400 clamp(26px,3.4vw,46px)/1 "Lilita One",sans-serif}
.perdio{font:400 clamp(22px,2.6vw,36px)/1 "Lilita One",sans-serif;padding:8px 16px 10px;border:3px solid var(--borde);border-radius:14px;box-shadow:0 4px 0 var(--borde)}
.etiqueta .pts{font:400 16px/1 "Lilita One",sans-serif;background:#0a1030;color:var(--amarillo);border:3px solid var(--borde);border-radius:10px;padding:3px 8px 4px}
.aviso{position:fixed;right:18px;bottom:22px;max-width:min(36vw,460px);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.aviso div{font:400 clamp(18px,2vw,28px)/1.1 "Lilita One",sans-serif;background:var(--panel);border:3px solid var(--borde);border-radius:14px;padding:10px 16px;box-shadow:0 4px 0 var(--borde);animation:entra .25s ease-out}
.aviso small{display:block;font:800 14px Nunito,sans-serif;color:var(--suave)}
@keyframes entra{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body class="esc-ciudad">
<!-- Prototipo de la sala de Físico (zona aparte; decisión de Elías 2026-11-26): personajes de frente sobre el fondo del
     escenario; el anfitrión da puntos, castigos y retos desde su celular; primer juego físico «Palabra prohibida».
     ?sala=, ?escenario=ciudad|alberca|fogata|parque, ?palabra=visible|oculta, ?bots=N, ?lat=&jit=. -->
<div class="velo"></div>
<canvas id="lienzo" aria-hidden="true"></canvas>
<div class="capa" id="capa"></div>
<div class="titulo" id="titulo">Físico</div>
<div class="juego" id="juego"></div>
<div class="sala" id="sala"><small>Sala</small><b id="codigo">----</b><small>Abre el control en otra pestaña</small>
  <a id="abrir" target="_blank" rel="noopener">+ Celular de prueba</a></div>
<div class="aviso" id="aviso"></div>
<div class="aviso-red" id="red"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script src="../logicas.js"></script>
<script src="../motor-personajes.js"></script>
<script src="figuras-mj.js"></script>
<script src="escena-mj.js"></script>
<script type="module" src="tv-fisico.js"></script>
</body>
</html>
