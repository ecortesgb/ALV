<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Martillazo · TV</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<link rel="stylesheet" href="tv.css">
<style>
.puntos-ronda{font:400 20px/1.2 "Lilita One",sans-serif;color:var(--amarillo);text-shadow:0 2px 2px var(--noche)}
.centro{text-align:center;width:96%;pointer-events:none}.centro.chico{white-space:normal}
.medidor{position:absolute;width:28px;height:clamp(100px,20vh,180px);transform:translate(-50%,-50%);border:3px solid var(--borde);border-radius:8px;background:#25336c;box-shadow:0 3px 0 var(--borde)}
.medidor .zona{position:absolute;bottom:47%;height:6%;left:0;right:0;background:#8cf09a}
.medidor .medio{position:absolute;bottom:50%;left:-5px;right:-5px;border-top:2px solid #fff}
.medidor .aguja{position:absolute;left:-7px;right:-7px;height:5px;background:var(--amarillo);border:1px solid var(--borde);border-radius:3px;transform:translateY(50%)}
.medidor .tope,.medidor .base{position:absolute;left:50%;transform:translateX(-50%);font:800 12px/1 Nunito,sans-serif;text-shadow:0 1px 2px #000}
.medidor .tope{bottom:calc(100% + 5px)}.medidor .base{top:calc(100% + 5px)}
.medidor.listo{opacity:.6}.medidor.listo .aguja{background:#fff}
</style>
</head>
<body>
<!-- Mismo lobby y transporte que Desenfunda. ?bots=N permite una partida de prueba. -->
<canvas id="lienzo" aria-hidden="true"></canvas>
<div class="capa" id="capa"></div>
<div class="titulo">Martillazo</div>
<div class="sub" id="sub">Entra desde tu celular</div>
<div class="marcador oculto" id="marcador">Intento <span id="intento">1</span> / 3</div>
<div class="sala" id="sala"><small>Sala</small><b id="codigo">----</b><small id="como">Abre el control en otra pestaña</small>
  <a id="abrir" target="_blank" rel="noopener">+ Celular de prueba</a></div>
<div class="centro oculto" id="centro" role="status"></div>
<div class="podio oculto" id="podio"></div>
<button class="boton-tv" id="empezar" disabled>¡Empezar!</button>
<div class="aviso-red" id="red"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script src="../logicas.js"></script>
<script src="../motor-personajes.js"></script>
<script src="figuras-mj.js"></script>
<script src="escena-mj.js"></script>
<script type="module" src="tv-martillazo.js"></script>
</body>
</html>
