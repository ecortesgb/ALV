<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mesa de prueba</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800&display=swap">
<style>
:root{--noche:#0a1030;--amarillo:#ffcf2e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#070b22;color:#fff;font:700 14px Nunito,system-ui,sans-serif;overflow:hidden}
.mesa{display:grid;grid-template-columns:1fr auto;gap:10px;height:100%;padding:10px}
.tv{min-width:0;display:flex;flex-direction:column;gap:6px}
.tv iframe{flex:1;width:100%;border:4px solid #000;border-radius:12px;background:#141a3a}
.cels{display:flex;gap:8px;align-items:stretch}
.cel{display:flex;flex-direction:column;gap:4px;width:min(15vw,230px)}
.cel iframe{flex:1;width:100%;border:6px solid #000;border-radius:22px;background:#141a3a}
.barra{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.barra button{font-size:12px!important;padding:2px 8px!important}
.barra a,.barra button{font:400 15px "Lilita One",sans-serif;color:var(--noche);background:var(--amarillo);border:3px solid #000;border-radius:10px;padding:4px 10px;text-decoration:none;cursor:pointer}
small{color:#c9d2ff}
@media (max-width:900px){.mesa{grid-template-columns:1fr;grid-template-rows:55% 45%}.cel{width:31vw}}
</style>
</head>
<body>
<!-- Mesa de prueba del prototipo (zona aparte): la TV y 3 «celulares» en una sola página, todos en la misma sala.
     ?juego=bala|desenfunda|martillazo|paracaidas|alto|cuarto|fisico (bala por omisión), ?cels=1..4, ?lat=&jit= (red simulada en todos), más los de la TV (?cam, ?cuarto, ?bots). -->
<div class="mesa">
  <div class="tv">
    <div class="barra"><b id="tit">TV</b><small id="info"></small>
      <a id="bala" href="#">Esquiva la bala</a><a id="desenfunda" href="?juego=desenfunda">¡Desenfunda!</a><a id="martillazo" href="?juego=martillazo">Martillazo</a><a id="paracaidas" href="?juego=paracaidas">Paracaídas</a><a id="alto" href="?juego=alto">Alto total</a><a id="cuarto" href="#">Modo libre</a><a id="fisico" href="#">Físico</a></div>
    <iframe id="tv" title="TV"></iframe>
  </div>
  <div class="cels" id="cels"></div>
</div>
<script>
const q = new URLSearchParams(location.search);
const juego = ["desenfunda", "martillazo", "paracaidas", "alto", "cuarto", "fisico"].includes(q.get("juego")) ? q.get("juego") : "bala";
const sala = (q.get("sala") || "M" + Math.random().toString(36).slice(2, 5)).toUpperCase();
const red = ["lat", "jit"].filter(k => q.get(k)).map(k => `&${k}=${q.get(k)}`).join("");
const tvExtra = ["bots", "escenario", "palabra"].filter(k => q.get(k)).map(k => `&${k}=${q.get(k)}`).join("");
document.getElementById("tv").src = `tv-${juego === "alto" ? "alto-total" : juego}.html?sala=${sala}${red}${tvExtra}`;
document.getElementById("tit").textContent = { alto: "TV · Alto total", bala: "TV · Esquiva la bala", desenfunda: "TV · ¡Desenfunda!", martillazo: "TV · Martillazo", paracaidas: "TV · Paracaídas", cuarto: "TV · Modo libre (el cuarto)", fisico: "TV · Físico" }[juego];
document.getElementById("info").textContent = `sala ${sala}` + (red ? ` · red simulada ${q.get("lat") || 0} ± ${q.get("jit") || 0} ms` : "");
const lista = [["Ana", "iron-man"], ["Beto", "black-widow"], ["Caro", "hulk"], ["Dani", "wolverine"]].slice(0, Math.max(1, Math.min(4, Number(q.get("cels")) || 3)));
const cels = document.getElementById("cels");
// Los celulares entran un poco después que la TV, para que ya esté escuchando.
setTimeout(() => lista.forEach(([n, p]) => {
  const d = document.createElement("div"); d.className = "cel";
  const src = `control.html?sala=${sala}&nombre=${n}&personaje=${p}&entrar=1${red}`;
  const barra = document.createElement("div"); barra.className = "barra";
  const nombre = document.createElement("small"); nombre.textContent = n;
  const cerrar = document.createElement("button"); cerrar.textContent = "Cerrar";
  const frame = document.createElement("iframe"); frame.title = "Celular de " + n; frame.src = src;
  barra.append(nombre, cerrar); d.append(barra, frame);
  // «Cerrar» quita el celular (como cerrar la pestaña: prueba de desconexión); «Abrir» lo vuelve a cargar.
  const b = d.querySelector("button");
  b.onclick = () => {
    const f = d.querySelector("iframe");
    if (f) { f.remove(); b.textContent = "Abrir"; }
    else { const nf = document.createElement("iframe"); nf.title = "Celular de " + n; nf.src = src; d.appendChild(nf); b.textContent = "Cerrar"; }
  };
  cels.appendChild(d);
}), 1500);
const ir = j => { const u = new URLSearchParams(q); u.set("juego", j); u.delete("sala"); location.search = u.toString(); };
document.getElementById("bala").onclick = e => { e.preventDefault(); ir("bala"); };
document.getElementById("desenfunda").onclick = e => { e.preventDefault(); ir("desenfunda"); };
document.getElementById("martillazo").onclick = e => { e.preventDefault(); ir("martillazo"); };
document.getElementById("paracaidas").onclick = e => { e.preventDefault(); ir("paracaidas"); };
document.getElementById("alto").onclick = e => { e.preventDefault(); ir("alto"); };
document.getElementById("cuarto").onclick = e => { e.preventDefault(); ir("cuarto"); };
document.getElementById("fisico").onclick = e => { e.preventDefault(); ir("fisico"); };
</script>
</body>
</html>
